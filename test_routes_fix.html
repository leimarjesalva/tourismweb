<!DOCTYPE html>
<html>
<head>
    <title>Route API Fix Verification</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            color: #ddd;
            padding: 40px 20px;
            min-height: 100vh;
        }
        .container { max-width: 1000px; margin: 0 auto; }
        h1 { color: #667eea; margin-bottom: 30px; text-align: center; }
        .test-card {
            background: rgba(102,126,234,0.1);
            border: 1px solid #667eea;
            border-radius: 10px;
            padding: 20px;
            margin: 20px 0;
        }
        .test-card h2 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.1rem;
        }
        .test-result {
            background: rgba(0,0,0,0.3);
            padding: 15px;
            border-radius: 8px;
            margin: 10px 0;
            font-family: monospace;
            font-size: 12px;
            max-height: 300px;
            overflow-y: auto;
        }
        .success { border-left: 4px solid #00ff00; }
        .error { border-left: 4px solid #ff6666; }
        .pending { border-left: 4px solid #ffaa00; }
        button {
            background: linear-gradient(135deg, #667eea, #5568d3);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            margin: 10px 0;
            transition: all 0.3s;
        }
        button:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(102,126,234,0.3); }
        .status { font-weight: bold; margin: 5px 0; }
        .status.ok { color: #00ff00; }
        .status.err { color: #ff6666; }
        .status.warn { color: #ffaa00; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎯 Route API Fix Verification</h1>
        
        <div class="test-card">
            <h2>1️⃣ Test API Response (Raw JSON)</h2>
            <button onclick="testAPIRaw()">🔄 Test Route API</button>
            <div id="apiRaw" class="test-result pending">Waiting...</div>
        </div>

        <div class="test-card">
            <h2>2️⃣ Test JSON Parsing</h2>
            <button onclick="testJSONParsing()">🔄 Test Parsing</button>
            <div id="jsonParse" class="test-result pending">Waiting...</div>
        </div>

        <div class="test-card">
            <h2>3️⃣ Test Frontend Integration</h2>
            <button onclick="testFrontendFunction()">🔄 Test Frontend</button>
            <div id="frontend" class="test-result pending">Waiting...</div>
        </div>

        <div class="test-card">
            <h2>4️⃣ Route Visualization Preview</h2>
            <div id="routePreview" style="width: 100%; height: 300px; background: #000; border-radius: 8px; margin-top: 10px;"></div>
        </div>

        <div class="test-card" style="background: rgba(0,255,0,0.05); border-color: #00ff00;">
            <h2 style="color: #00ff00;">✅ Ready to View</h2>
            <p style="margin: 10px 0;">Once all tests pass, open the main page:</p>
            <button onclick="window.location.href='index.html'" style="background: linear-gradient(135deg, #00ff00, #00cc00); font-size: 16px;">
                🌐 Open Main Community Events Page
            </button>
        </div>
    </div>

    <script>
        async function testAPIRaw() {
            const el = document.getElementById('apiRaw');
            el.innerHTML = '<div class="status warn">⏳ Testing...</div>';
            try {
                const response = await fetch('backend/api.php?action=suggest_optimal_route&event_id=12&crowd_level=8000');
                const text = await response.text();
                
                // Check if valid JSON
                try {
                    const json = JSON.parse(text);
                    el.innerHTML = `<div class="status ok">✅ Valid JSON received</div>
                        <div style="color: #aaa; margin: 10px 0;">Routes: ${json.routes ? json.routes.length : 0}</div>
                        <div style="color: #00ff00;">Response Preview:</div>
                        <pre>${JSON.stringify(json, null, 2).substring(0, 500)}...</pre>`;
                } catch (parseErr) {
                    el.innerHTML = `<div class="status err">❌ Invalid JSON: ${parseErr.message}</div>
                        <div style="color: #ff9999;">Raw response (first 500 chars):</div>
                        <pre>${text.substring(0, 500)}</pre>`;
                }
            } catch (err) {
                el.innerHTML = `<div class="status err">❌ Fetch failed: ${err.message}</div>`;
            }
        }

        async function testJSONParsing() {
            const el = document.getElementById('jsonParse');
            el.innerHTML = '<div class="status warn">⏳ Testing...</div>';
            try {
                const response = await fetch('backend/api.php?action=suggest_optimal_route&event_id=12&crowd_level=8000');
                const contentType = response.headers.get('content-type');
                
                el.innerHTML = `<div class="status ${contentType?.includes('json') ? 'ok' : 'err'}">
                    ${contentType?.includes('json') ? '✅' : '❌'} Content-Type: ${contentType}
                </div>`;
                
                const text = await response.text();
                try {
                    const data = JSON.parse(text);
                    el.innerHTML += `<div class="status ok">✅ JSON parsed successfully</div>
                        <div style="color: #00ff00; margin-top: 10px;">
                            <strong>Response Structure:</strong><br>
                            • success: ${data.success}<br>
                            • event_id: ${data.event_id}<br>
                            • Routes: ${data.routes ? data.routes.length : 0}<br>
                            ${data.routes ? data.routes.map((r, i) => `  ${i+1}. ${r.name} (${r.distance}km)`).join('<br>') : 'No routes'}
                        </div>`;
                } catch (parseErr) {
                    el.innerHTML += `<div class="status err">❌ Parse Error: ${parseErr.message}</div>`;
                }
            } catch (err) {
                el.innerHTML = `<div class="status err">❌ Error: ${err.message}</div>`;
            }
        }

        async function testFrontendFunction() {
            const el = document.getElementById('frontend');
            el.innerHTML = '<div class="status warn">⏳ Testing displayRouteSuggestions function...</div>';
            try {
                // Test if the function exists in the main page
                const response = await fetch('index.html');
                const html = await response.text();
                
                const checks = [
                    { name: 'displayRouteSuggestions', found: html.includes('function displayRouteSuggestions') },
                    { name: 'initializeRouteMap', found: html.includes('function initializeRouteMap') },
                    { name: 'routeSuggestions container', found: html.includes('id="routeSuggestions"') },
                    { name: 'routeMapContainer', found: html.includes('id="routeMapContainer"') },
                ];
                
                let html_result = '<div style="color: #00ff00;"><strong>Frontend Functions Check:</strong><br>';
                checks.forEach(check => {
                    html_result += `${check.found ? '✅' : '❌'} ${check.name}<br>`;
                });
                html_result += '</div>';
                
                el.innerHTML = html_result;
            } catch (err) {
                el.innerHTML = `<div class="status err">❌ Error: ${err.message}</div>`;
            }
        }

        // Auto-run tests on page load
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                testAPIRaw();
                testJSONParsing();
                testFrontendFunction();
                drawRoutePreview();
            }, 500);
        });

        function drawRoutePreview() {
            const canvas = document.getElementById('routePreview');
            if (canvas.tagName !== 'CANVAS') {
                const newCanvas = document.createElement('canvas');
                newCanvas.width = canvas.offsetWidth;
                newCanvas.height = canvas.offsetHeight;
                newCanvas.style.display = 'block';
                canvas.parentNode.replaceChild(newCanvas, canvas);
                
                const ctx = newCanvas.getContext('2d');
                ctx.fillStyle = '#1a1a2e';
                ctx.fillRect(0, 0, newCanvas.width, newCanvas.height);
                
                // Draw simple Legazpi map representation
                ctx.fillStyle = '#334466';
                ctx.fillRect(50, 50, 300, 250);
                
                // Draw routes
                const routes = [
                    { name: 'North Bypass', color: '#00ff00', path: [[100, 100], [150, 80], [250, 100]] },
                    { name: 'Main Street', color: '#ffaa00', path: [[120, 150], [180, 140], [250, 160]] },
                    { name: 'Downtown', color: '#ff6666', path: [[140, 200], [200, 180], [250, 200]] },
                ];
                
                routes.forEach(route => {
                    ctx.strokeStyle = route.color;
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.moveTo(route.path[0][0], route.path[0][1]);
                    route.path.forEach(p => ctx.lineTo(p[0], p[1]));
                    ctx.stroke();
                    
                    // Label
                    ctx.fillStyle = route.color;
                    ctx.font = 'bold 12px Arial';
                    ctx.fillText(route.name, route.path[route.path.length-1][0] + 10, route.path[route.path.length-1][1]);
                });
                
                // Draw destination marker
                ctx.fillStyle = '#667eea';
                ctx.beginPath();
                ctx.arc(250, 150, 8, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = 'white';
                ctx.font = 'bold 10px Arial';
                ctx.fillText('Event', 255, 155);
            }
        }
    </script>
</body>
</html>
