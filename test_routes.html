<!DOCTYPE html>
<html>
<head>
    <title>Route Optimization Test</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            background: #1a1a2e; 
            color: #ddd; 
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .test-box {
            background: #16213e;
            border: 1px solid #667eea;
            border-radius: 8px;
            padding: 20px;
            margin: 15px 0;
        }
        .test-result {
            padding: 10px;
            margin: 10px 0;
            border-radius: 4px;
            border-left: 3px solid #667eea;
            background: rgba(102,126,234,0.1);
        }
        .success { border-left-color: #00ff00; background: rgba(0,255,0,0.1); }
        .error { border-left-color: #ff6666; background: rgba(255,102,102,0.1); }
        .warning { border-left-color: #ffaa00; background: rgba(255,170,0,0.1); }
        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            margin: 5px;
            font-size: 14px;
        }
        button:hover { background: #5568d3; }
        pre {
            background: rgba(0,0,0,0.5);
            padding: 10px;
            border-radius: 4px;
            overflow-x: auto;
            max-height: 300px;
            overflow-y: auto;
        }
        h1, h2 { color: #667eea; margin-top: 0; }
    </style>
</head>
<body>
    <h1>🗺️ Route Optimization System - Test Page</h1>
    
    <div class="test-box">
        <h2>1. Test Event API</h2>
        <button onclick="testEventAPI()">Check Events</button>
        <div id="eventResult"></div>
    </div>
    
    <div class="test-box">
        <h2>2. Test Route API</h2>
        <input type="number" id="eventId" placeholder="Event ID" value="1" style="padding: 8px; margin: 5px; border-radius: 4px; border: none;">
        <input type="number" id="crowdLevel" placeholder="Crowd Level" value="8000" style="padding: 8px; margin: 5px; border-radius: 4px; border: none;">
        <button onclick="testRouteAPI()">Get Routes</button>
        <div id="routeResult"></div>
    </div>
    
    <div class="test-box">
        <h2>3. Test Frontend Routes Display</h2>
        <button onclick="testRouteDisplay()">Show Test Routes</button>
        <div id="testMapContainer" style="width: 100%; height: 400px; background: #0a0e27; border-radius: 8px; margin-top: 10px;"></div>
        <div id="testSuggestions"></div>
    </div>
    
    <div class="test-box">
        <h2>4. System Status</h2>
        <div id="statusResults"></div>
    </div>

    <script>
        function log(containerId, message, type = 'info') {
            const container = document.getElementById(containerId);
            const div = document.createElement('div');
            div.className = `test-result ${type}`;
            const icon = type === 'success' ? '✅' : (type === 'error' ? '❌' : '⚠️');
            div.innerHTML = `${icon} ${message}`;
            container.appendChild(div);
        }

        async function testEventAPI() {
            const result = document.getElementById('eventResult');
            result.innerHTML = '';
            log('eventResult', 'Fetching events...', 'warning');
            
            try {
                const response = await fetch('../backend/api.php?action=list_events');
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                
                const data = await response.json();
                
                if (!data.events || data.events.length === 0) {
                    log('eventResult', 'No events found in database', 'error');
                    return;
                }
                
                log('eventResult', `Found ${data.events.length} events`, 'success');
                
                const legazpiEvents = data.events.filter(e => e.location && e.location.toLowerCase().includes('legazpi'));
                log('eventResult', `${legazpiEvents.length} events in Legazpi City`, legazpiEvents.length > 0 ? 'success' : 'warning');
                
                if (legazpiEvents.length > 0) {
                    const event = legazpiEvents[0];
                    log('eventResult', `Test event: "${event.title}" at ${event.location}`, 'success');
                    document.getElementById('eventId').value = event.id;
                }
                
                const details = `<pre>Sample event:\n${JSON.stringify(data.events[0], null, 2)}</pre>`;
                result.innerHTML += details;
            } catch (err) {
                log('eventResult', `Error: ${err.message}`, 'error');
            }
        }

        async function testRouteAPI() {
            const result = document.getElementById('routeResult');
            result.innerHTML = '';
            const eventId = document.getElementById('eventId').value;
            const crowdLevel = document.getElementById('crowdLevel').value;
            
            log('routeResult', `Testing route API for event ${eventId} with crowd ${crowdLevel}...`, 'warning');
            
            try {
                const url = `../backend/api.php?action=suggest_optimal_route&event_id=${eventId}&crowd_level=${crowdLevel}`;
                const response = await fetch(url);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                
                const data = await response.json();
                
                if (!data.success) {
                    log('routeResult', `API Error: ${data.error}`, 'error');
                    return;
                }
                
                log('routeResult', `API Success! Got ${data.routes ? data.routes.length : 0} routes`, 'success');
                
                if (data.event) {
                    log('routeResult', `Event: ${data.event.title} at ${data.event.location}`, 'success');
                    log('routeResult', `Coordinates: ${data.event.lat}, ${data.event.lng}`, 'success');
                }
                
                const details = `<pre>${JSON.stringify(data, null, 2)}</pre>`;
                result.innerHTML += details;
                
                // Auto-populate test display
                if (data.success && data.routes) {
                    testRouteDisplay(data.routes);
                }
            } catch (err) {
                log('routeResult', `Error: ${err.message}`, 'error');
            }
        }

        function testRouteDisplay(routes = null) {
            const container = document.getElementById('testMapContainer');
            const suggBox = document.getElementById('testSuggestions');
            
            if (!routes) {
                routes = [
                    { name: 'Northern Bypass Route', distance: 8.5, duration: 12, reason: 'Low congestion' },
                    { name: 'Main Street Route', distance: 6.2, duration: 18, reason: 'Medium speed' },
                    { name: 'Downtown Route', distance: 5.8, duration: 35, reason: 'Avoid if possible' }
                ];
            }
            
            // Simple SVG visualization
            container.innerHTML = `
                <svg width="100%" height="100%" viewBox="0 0 400 300" style="background: linear-gradient(135deg, #0a0e27 0%, #1a1a2e 100%);">
                    <text x="200" y="30" text-anchor="middle" fill="#667eea" font-size="18" font-weight="bold">Legazpi City Routes</text>
                    
                    <!-- Roads -->
                    <line x1="50" y1="100" x2="350" y2="100" stroke="#444" stroke-width="2"/>
                    <line x1="100" y1="30" x2="100" y2="250" stroke="#444" stroke-width="2"/>
                    <line x1="200" y1="30" x2="200" y2="250" stroke="#444" stroke-width="2"/>
                    <line x1="300" y1="50" x2="300" y2="230" stroke="#444" stroke-width="2"/>
                    
                    <!-- Routes -->
                    <path d="M 50 150 Q 150 80 350 100" stroke="#00ff00" stroke-width="3" fill="none" opacity="0.8" stroke-dasharray="5,5"/>
                    <path d="M 100 150 L 200 120 L 300 150" stroke="#ffaa00" stroke-width="2" fill="none" opacity="0.7"/>
                    <path d="M 100 200 L 200 180 L 300 200" stroke="#ff6666" stroke-width="2" fill="none" opacity="0.6"/>
                    
                    <!-- Event marker -->
                    <circle cx="200" cy="150" r="8" fill="#667eea" stroke="white" stroke-width="2"/>
                    <text x="220" y="155" fill="#fff" font-size="12">EVENT</text>
                    
                    <!-- Legend -->
                    <text x="10" y="285" fill="#00ff00" font-size="11">🟢 Best</text>
                    <text x="150" y="285" fill="#ffaa00" font-size="11">🟠 Alternate</text>
                    <text x="280" y="285" fill="#ff6666" font-size="11">🔴 Avoid</text>
                </svg>
            `;
            
            // Suggestions
            let html = '<h3 style="color: #667eea; margin: 0 0 10px 0;">📍 Recommended Routes:</h3>';
            routes.forEach((route, idx) => {
                const icons = ['🟢 BEST', '🟠 ALTERNATE', '🔴 AVOID'];
                html += `
                    <div style="margin: 10px 0; padding: 10px; background: rgba(255,255,255,0.05); border-left: 3px solid ${idx === 0 ? '#00ff00' : (idx === 1 ? '#ffaa00' : '#ff6666')}; border-radius: 4px;">
                        <p style="margin: 0 0 5px 0; font-weight: 600;">${icons[idx] || '?'} ${route.name}</p>
                        <p style="margin: 0;">📏 ${route.distance} km | ⏱️ ${route.duration} mins | ${route.reason}</p>
                    </div>
                `;
            });
            suggBox.innerHTML = html;
        }

        function checkSystemStatus() {
            const status = document.getElementById('statusResults');
            status.innerHTML = '';
            
            // Check containers
            const routeContainer = document.querySelector('#routeMapContainer');
            if (routeContainer) {
                log('statusResults', `✓ HTML container #routeMapContainer exists (${routeContainer.offsetHeight}px tall)`, 'success');
            } else {
                log('statusResults', '✗ HTML container #routeMapContainer not found', 'error');
            }
            
            const suggContainer = document.querySelector('#routeSuggestions');
            if (suggContainer) {
                log('statusResults', `✓ HTML container #routeSuggestions exists`, 'success');
            } else {
                log('statusResults', '✗ HTML container #routeSuggestions not found', 'error');
            }
            
            // Check functions
            if (typeof testRouteAPI === 'function') {
                log('statusResults', '✓ testRouteAPI function exists', 'success');
            }
            
            // Check API path
            const apiPath = new URL('../backend/api.php?action=test', window.location).pathname.replace('/test.html', '');
            log('statusResults', `📍 API path: ${apiPath}`, 'info');
            
            // Check browser
            log('statusResults', `🌐 Browser: ${navigator.userAgent.split(' ').pop()}`, 'info');
        }
        
        // Run status check on load
        window.addEventListener('load', checkSystemStatus);
    </script>
</body>
</html>
